server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # Global CORS — tightened per-environment via env vars
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${ALLOWED_ORIGINS:http://localhost:5173}   # Vite dev server
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      routes:
        # ── Auth (public) ──────────────────────────────────
        - id: auth-public
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # ── User service (protected) ───────────────────────
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # ── Content service (mixed) ────────────────────────
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/companies/**,/api/questions/**,/api/papers/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # ── Analysis service (protected) ───────────────────
        - id: analysis-service
          uri: ${ANALYSIS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/analysis/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

# JWT public key for verification (private key stays in user-service only)
jwt:
  public-key: ${JWT_PUBLIC_KEY}   # PEM string injected via env var

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
